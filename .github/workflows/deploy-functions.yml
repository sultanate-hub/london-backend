name: Deploy Edge Functions

on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/**'
      - 'supabase/config.toml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          # Pin the CLI: "latest" resolves via the GitHub releases API and has
          # failed with Gateway Timeout, blocking deploys even when code is fine.
          version: 2.114.0

      - name: Verify SUPABASE_ACCESS_TOKEN secret
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        if: env.SUPABASE_ACCESS_TOKEN == ''
        run: |
          echo "::error::SUPABASE_ACCESS_TOKEN secret is missing. Add it in Settings -> Secrets and variables -> Actions."
          exit 1

      - name: Write functions env from GitHub secrets
        run: |
          cat > /tmp/functions.env <<'EOF'
          MIKROTIK_API_KEY=${{ secrets.MIKROTIK_API_KEY }}
          PAYMENT_PROVIDER=${{ secrets.PAYMENT_PROVIDER }}
          ADMIN_SUPER_PASS=${{ secrets.ADMIN_SUPER_PASS }}
          ADMIN_VIEW_PASS=${{ secrets.ADMIN_VIEW_PASS }}
          PUBLIC_BASE_URL=${{ secrets.PUBLIC_BASE_URL }}
          EOF
      # NOTE: payment provider keys (PAYSTACK_SECRET_KEY, SQUAD_SECRET_KEY,
      # SQUAD_BASE_URL) are managed directly in the Supabase dashboard, NOT here,
      # so a deploy can never overwrite them with empty GitHub secrets.

      - name: Set secrets on Supabase
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase secrets set --env-file /tmp/functions.env --project-ref pvslxeakzyhxfzlqakqg --yes

      - name: Deploy functions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase functions deploy hotspot --project-ref pvslxeakzyhxfzlqakqg --use-api --yes
